# ===========================================
# Docker Compose - Production (Dokploy/Traefik)
# ===========================================
# Optimizado para Dokploy con Traefik reverse proxy
# SSL automático via Let's Encrypt

version: '3.8'

services:
  # ─────────────────────────────────────────────
  # BACKEND - Apollo Server
  # ─────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tinkuy-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:4000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    expose:
      - "4000"
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - FRONTEND_URL=${FRONTEND_URL}
      - JWT_ADMIN_SECRET=${JWT_ADMIN_SECRET}
      - JWT_CUSTOMER_SECRET=${JWT_CUSTOMER_SECRET}
      - MP_ACCESS_TOKEN=${MP_ACCESS_TOKEN}
      - MP_WEBHOOK_SECRET=${MP_WEBHOOK_SECRET}
      - MP_MODE=${MP_MODE:-production}
      - SENTRY_DSN=${SENTRY_DSN}
      - RATE_LIMIT_GENERAL_WINDOW_MS=60000
      - RATE_LIMIT_GENERAL_MAX_REQUESTS=100
      - RATE_LIMIT_AUTH_WINDOW_MS=900000
      - RATE_LIMIT_AUTH_MAX_REQUESTS=5
      - RATE_LIMIT_CHECKOUT_WINDOW_MS=60000
      - RATE_LIMIT_CHECKOUT_MAX_REQUESTS=10
      - CART_TTL_SECONDS=86400
      - STOCK_TTL_SECONDS=300
      - WEBHOOK_TIMEOUT_MS=30000
      - UPLOAD_DIR=/app/uploads
      - MAX_FILE_SIZE_MB=5
      - TRUST_PROXY=1
      - LOG_LEVEL=info
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
    networks:
      - tinkuy-network
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    stop_grace_period: 30s

  # ─────────────────────────────────────────────
  # REDIS - Cache & Sessions
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: tinkuy-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy volatile-lru
      --maxmemory-samples 5
      --tcp-keepalive 300
      --lazyfree-lazy-eviction yes
      --lazyfree-lazy-expire yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - tinkuy-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─────────────────────────────────────────────
  # WORKER - Background Jobs
  # ─────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: tinkuy-worker
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - SENTRY_DSN=${SENTRY_DSN}
      - WORKER_MODE=worker
    volumes:
      - uploads:/app/uploads
    networks:
      - tinkuy-network
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 30s

  # ─────────────────────────────────────────────
  # CRON - Scheduled Jobs
  # ─────────────────────────────────────────────
  cron:
    build:
      context: .
      dockerfile: Dockerfile.cron
    container_name: tinkuy-cron
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - SENTRY_DSN=${SENTRY_DSN}
    volumes:
      - uploads:/app/uploads
    networks:
      - tinkuy-network
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Cron schedule: abandoned cart (every 6h), cleanup (daily), backup metadata (hourly)
    command: ["sh", "-c", "echo '0 */6 * * * node dist/jobs/abandonedCart.js' | crontab - && echo '0 3 * * * node dist/jobs/cleanup.js' | crontab - && crond -f"]

# ─────────────────────────────────────────────
# VOLUMES - Persistent Data
# ─────────────────────────────────────────────
volumes:
  redis_data:
    driver: local
  uploads:
    driver: local
  logs:
    driver: local

# ─────────────────────────────────────────────
# NETWORKS - Internal Communication
# ─────────────────────────────────────────────
networks:
  tinkuy-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
