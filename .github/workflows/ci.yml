name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Check ESLint installation
        run: |
          if ! npm list eslint > /dev/null 2>&1; then
            echo "ESLint not found, installing..."
            npm install -D eslint @typescript-eslint/parser @typescript-eslint/eslint-plugin
          fi
      - name: Run ESLint
        run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run TypeScript type check
        run: npm run typecheck

  test:
    name: Test with Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run tests with coverage
        run: npm test -- --coverage
      - name: Check coverage thresholds
        run: |
          COVERAGE_FILE="coverage/coverage-summary.json"
          if [ -f "$COVERAGE_FILE" ]; then
            LINES_PCT=$(cat $COVERAGE_FILE | grep -o '"lines":"[0-9.]*' | cut -d'"' -f4)
            FUNCTIONS_PCT=$(cat $COVERAGE_FILE | grep -o '"functions":"[0-9.]*' | cut -d'"' -f4)
            BRANCHES_PCT=$(cat $COVERAGE_FILE | grep -o '"branches":"[0-9.]*' | cut -d'"' -f4)
            
            echo "Coverage: lines=$LINES_PCT%, functions=$FUNCTIONS_PCT%, branches=$BRANCHES_PCT%"
            
            PASS=true
            if (( $(echo "$LINES_PCT < 80" | bc -l) )); then
              echo "Lines coverage ($LINES_PCT%) is below threshold (80%)"
              PASS=false
            fi
            if (( $(echo "$FUNCTIONS_PCT < 80" | bc -l) )); then
              echo "Functions coverage ($FUNCTIONS_PCT%) is below threshold (80%)"
              PASS=false
            fi
            if (( $(echo "$BRANCHES_PCT < 70" | bc -l) )); then
              echo "Branches coverage ($BRANCHES_PCT%) is below threshold (70%)"
              PASS=false
            fi
            
            if [ "$PASS" = false ]; then
              exit 1
            fi
          else
            echo "Coverage file not found at $COVERAGE_FILE"
            exit 1
          fi
